name: stoichiomaster
description: Aplikasi edukasi interaktif stoikiometri kimia & kalkulator reaksi dengan Flutter dan Supabase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
